version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # Limit to a single open PR and group updates so Dependabot opens one combined PR
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      all-dependencies:
        patterns:
          - "*"
        # Optional: include update-types or exclude specific packages here
        # This groups all matching updates into a single pull request named 'all-dependencies'
    # Ignore all major and minor version updates (only allow patches and other non-major/minor updates)
    allow:
      - dependency-name: "@azure/msal-browser"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
