version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # Limit to a single open PR and group updates so Dependabot opens one combined PR
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      all-dependencies:
        patterns:
          - "*"
        # Optional: include update-types or exclude specific packages here
        # This groups all matching updates into a single pull request named 'all-dependencies'
